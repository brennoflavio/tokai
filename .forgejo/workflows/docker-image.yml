# SPDX-License-Identifier: AGPL-3.0-or-later
name: Publish container image
enable-email-notifications: true

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (for example, v1.2.3)
        required: true
        type: string

env:
  REGISTRY_HOST: git.brennoflavio.com.br
  IMAGE_REPOSITORY: git.brennoflavio.com.br/brennoflavio/tokai

jobs:
  test:
    name: Validate source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: https://github.com/astral-sh/setup-uv@v6

      - name: Run tests
        run: uv run pytest

  publish:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: https://code.forgejo.org/docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: https://code.forgejo.org/docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set image tag
        id: image
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must use the format vx.y.z" >&2
            exit 1
          fi
          echo "tag=${VERSION}" >> "${FORGEJO_OUTPUT:-$GITHUB_OUTPUT}"

      - name: Ensure version is unused
        env:
          VERSION: ${{ steps.image.outputs.tag }}
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          url="${FORGEJO_SERVER_URL%/}/api/v1/repos/${{ forgejo.repository }}/tags/${VERSION}"
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: token ${FORGEJO_TOKEN}" "$url")
          case "$status" in
            404) ;;
            200)
              echo "tag ${VERSION} already exists" >&2
              exit 1
              ;;
            *)
              echo "failed to check whether tag ${VERSION} exists (HTTP ${status})" >&2
              exit 1
              ;;
          esac

      - name: Build and push container image
        uses: https://code.forgejo.org/docker/build-push-action@v6
        with:
          push: true
          context: .
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ steps.image.outputs.tag }}

      - name: Create README image-tag pull request
        shell: bash
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FORGEJO_TOKEN" | base64 -w 0)"
          git_auth=(-c "http.${FORGEJO_SERVER_URL%/}/.extraheader=$auth_header")
          repository_url="${FORGEJO_SERVER_URL%/}/${{ forgejo.repository }}.git"
          api_url="${FORGEJO_SERVER_URL%/}/api/v1/repos/${{ forgejo.repository }}"
          branch="docs/readme-image-${IMAGE_TAG}"

          if git "${git_auth[@]}" ls-remote --exit-code --heads "$repository_url" "$branch" >/dev/null; then
            git "${git_auth[@]}" clone --branch "$branch" --single-branch "$repository_url" tokai
            cd tokai
            IMAGE_TAG="$IMAGE_TAG" python - <<'PY'
          import os
          import re
          from pathlib import Path

          image = "ghcr.io/brennoflavio/tokai"
          tags = re.findall(
              rf"{re.escape(image)}:(v[0-9]+\.[0-9]+\.[0-9]+)",
              Path("README.md").read_text(),
          )
          if tags != [os.environ["IMAGE_TAG"]]:
              raise SystemExit(f"expected README image tag {os.environ['IMAGE_TAG']}, found {tags}")
          PY
          else
            git "${git_auth[@]}" clone --branch master --single-branch "$repository_url" tokai
            cd tokai
            IMAGE_TAG="$IMAGE_TAG" python - <<'PY'
          import os
          import re
          from pathlib import Path

          readme = Path("README.md")
          image = "ghcr.io/brennoflavio/tokai"
          updated, matches = re.subn(
              rf"{re.escape(image)}:v[0-9]+\.[0-9]+\.[0-9]+",
              f"{image}:{os.environ['IMAGE_TAG']}",
              readme.read_text(),
          )
          if matches != 1:
              raise SystemExit(f"expected one README image tag, found {matches}")
          readme.write_text(updated)
          PY

            git config user.name "Forgejo Actions"
            git config user.email "actions@brennoflavio.com.br"
            git add README.md
            git commit -m "docs: update Docker image to ${IMAGE_TAG}"
            git "${git_auth[@]}" push origin "HEAD:refs/heads/${branch}"
          fi

          pulls=$(curl --fail-with-body --silent --show-error \
            --header "Authorization: token ${FORGEJO_TOKEN}" \
            "${api_url}/pulls?state=open&base=master")
          if PULLS="$pulls" BRANCH="$branch" python - <<'PY'; then
          import json
          import os
          import sys

          exists = any(pull["head"]["ref"] == os.environ["BRANCH"] for pull in json.loads(os.environ["PULLS"]))
          sys.exit(0 if exists else 1)
          PY
            exit 0
          fi

          payload=$(BRANCH="$branch" python - <<'PY'
          import json
          import os

          tag = os.environ["IMAGE_TAG"]
          print(json.dumps({
              "title": f"docs: update Docker image to {tag}",
              "body": f"Updates the README Docker image tag to `{tag}`.",
              "head": os.environ["BRANCH"],
              "base": "master",
          }))
          PY
          )
          curl --fail-with-body --request POST \
            --header "Authorization: token ${FORGEJO_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "${api_url}/pulls"

      - name: Create release
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          tag: ${{ steps.image.outputs.tag }}
          sha: ${{ forgejo.sha }}
          token: ${{ forgejo.token }}
          skip-assets: true

  deploy-vps:
    name: Deploy to VPS
    if: forgejo.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    env:
      VPS_USER: tokai
      VPS_DEPLOY_PATH: /home/tokai/tokai
      TOKAI_APP_URL: https://tokai.brennoflavio.com.br

    steps:
      - name: Checkout code
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install rsync
        shell: bash
        run: |
          if ! command -v rsync >/dev/null; then
            if [ "$(id -u)" -eq 0 ]; then
              apt-get update
              apt-get install --yes rsync
            else
              sudo apt-get update
              sudo apt-get install --yes rsync
            fi
          fi

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          : "${VPS_SSH_PRIVATE_KEY:?Set the VPS_SSH_PRIVATE_KEY secret}"
          : "${VPS_SSH_KNOWN_HOSTS:?Set the VPS_SSH_KNOWN_HOSTS secret}"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Copy source to VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          : "${VPS_HOST:?Set the VPS_HOST secret}"
          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )
          destination="$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/"
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_DEPLOY_PATH'"
          rsync -az --delete \
            --exclude .git \
            --exclude .venv \
            --exclude .pytest_cache \
            --exclude dist \
            --exclude .env \
            -e "ssh ${ssh_options[*]}" \
            ./ "$destination"

      - name: Start Tokai
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          : "${VPS_HOST:?Set the VPS_HOST secret}"
          ssh_options=(
            -i "$HOME/.ssh/id_ed25519"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
          )
          ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_DEPLOY_PATH' &&
             TOKAI_APP_URL='$TOKAI_APP_URL' docker compose up -d --build --remove-orphans &&
             for attempt in \$(seq 1 30); do
               if docker compose exec -T tokai python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/', timeout=2)\" >/dev/null; then
                 exit 0
               fi
               sleep 2
             done
             docker compose logs --tail=100 tokai
             exit 1"

      - name: Remove deployment key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/id_ed25519"

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.event_name }}-${{ inputs.version }}
  cancel-in-progress: false
