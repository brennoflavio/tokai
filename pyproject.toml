# SPDX-License-Identifier: AGPL-3.0-or-later
[project]
name = "tiktok-re"
version = "0.1.0"
description = "Privacy respecting frontend for TikTok"
license = "AGPL-3.0-or-later"
readme = "README.md"
authors = [
    { name = "brennoflavio", email = "contato@brennoflavio.com.br" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28,<1",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["scraper", "utils", "web"]
