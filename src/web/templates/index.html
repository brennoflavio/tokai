{% extends "base.html" %}

{% block content %}
<section class="hero" aria-labelledby="page-title">
  <h1 id="page-title">Tok<span>AI</span></h1>
  <p class="lede">A privacy preserving frontend for TikTok</p>

  <form class="url-form" action="/" method="post">
    <label class="visually-hidden" for="tiktok-url">TikTok URL</label>
    <input
      id="tiktok-url"
      name="url"
      type="url"
      inputmode="url"
      placeholder="Paste a TikTok URL"
      autocomplete="url"
      {% if error %}aria-describedby="url-error" aria-invalid="true"{% else %}aria-describedby="url-hint"{% endif %}
      required
    >
    <button type="submit">Watch privately</button>
  </form>
  {% if error %}
  <p id="url-error" class="form-message" role="alert">{{ error }}</p>
  {% else %}
  <p id="url-hint" class="form-hint">Paste a public TikTok video link to view it here.</p>
  {% endif %}
</section>
{% endblock %}
